name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdown-lint:
    name: markdown-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: markdownlint（.markdownlint-cli2.jsonc）
        run: python3 .claude/skills/markdown-linter/scripts/mdlint.py

  skill-tests:
    name: skill-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: python -m pip install pytest
      - name: pytest（.claude/skills/*/tests）
        run: python -m pytest -q .claude/skills

  app-build:
    name: app-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: 型別檢查（tsc --noEmit）
        run: npm run lint
      - name: 建置（vite build）
        run: npx vite build

  auto-merge:
    name: auto-merge
    needs: [markdown-lint, skill-tests, app-build]
    if: >-
      github.event_name == 'pull_request'
      && (startsWith(github.head_ref, 'claude/') || startsWith(github.head_ref, 'chore/refresh-etf-data-'))
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: 草稿 PR 先轉為 Ready（雲端工作階段一律先開草稿；已是 Ready 則無動作）
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_PAT }}
        run: gh pr ready "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"
      - name: 以 merge commit 合併（用 PAT，合併後才會觸發 main 的 CI）
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_PAT }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --merge --delete-branch
